name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # test:web runs `node --test` on .ts files, which needs Node's type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun --no-env-file install --frozen-lockfile

      - name: Typecheck
        run: |
          bun --no-env-file run typecheck
          bun --no-env-file run typecheck:host
          bun --no-env-file run typecheck:mock

      - name: Build
        id: build
        run: |
          bun --no-env-file run build
          bun --no-env-file run build:web

      - name: Test web
        run: bun --no-env-file run test:web

      # The suites are independent, so a web failure still reports API results.
      - name: Test API
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun --no-env-file run test:api
        env:
          INBOX_TEST_LIVE: "false"

  # Format is enforced. Lint and knip still have findings that predate them, so
  # those steps report without failing the job; remove their continue-on-error
  # once the findings are fixed.
  lint:
    name: Lint, format and knip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun --no-env-file install --frozen-lockfile

      - name: Lint
        continue-on-error: true
        run: bun --no-env-file run lint

      - name: Format
        run: bun --no-env-file run fmt:check

      - name: Unused code
        continue-on-error: true
        run: bun --no-env-file run knip
